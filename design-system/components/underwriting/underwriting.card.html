<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<link rel="stylesheet" href="../../styles.css"/>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { margin:0; font-family:var(--pb-font-sans); background:var(--pb-surface); color:var(--pb-text); padding:24px; }
  .grp { display:flex; flex-wrap:wrap; align-items:center; gap:12px; margin-bottom:20px; }
  .eyebrow { font-size:var(--pb-text-eyebrow); text-transform:uppercase; letter-spacing:var(--pb-tracking-eyebrow); color:var(--pb-text-muted); width:100%; margin-bottom:2px; }
  .dotline { display:flex; align-items:center; gap:8px; font-size:var(--pb-text-sm); color:var(--pb-text-muted); }
</style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { VerdictBadge, StatusPill, DecisionDot } = window.PaybotsDesignSystem_e75ed6;
    function Demo() {
      return (
        <div>
          <div className="grp"><span className="eyebrow">Verdict badges</span>
            <VerdictBadge decision="approve" subtitle="93%" />
            <VerdictBadge decision="reject" subtitle="item_mismatch" />
          </div>
          <div className="grp"><span className="eyebrow">Status pills</span>
            <StatusPill status="approve" />
            <StatusPill status="reject" />
            <StatusPill status="working" />
            <StatusPill status="neutral">Read-only</StatusPill>
          </div>
          <div className="grp"><span className="eyebrow">Decision dots</span>
            <span className="dotline"><DecisionDot decision="approve" /> Approved</span>
            <span className="dotline"><DecisionDot decision="reject" /> Rejected</span>
            <span className="dotline"><DecisionDot decision="working" pulse /> Working…</span>
            <span className="dotline"><DecisionDot decision="offline" /> Offline</span>
          </div>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById("root")).render(<Demo/>);
  </script>
</body>
</html>
