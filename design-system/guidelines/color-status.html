<!-- @dsCard group="Colors" viewport="700x180" name="Status & feedback" subtitle="Working amber (non-decision) + semantic borders + focus ring" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<link rel="stylesheet" href="../styles.css"/>
<style>
  body { margin:0; font-family:var(--pb-font-sans); background:var(--pb-surface); color:var(--pb-text); padding:20px 24px; }
  .row { display:flex; gap:14px; }
  .sw { flex:1; }
  .chip { height:52px; border-radius:var(--pb-radius-sm); border:1px solid rgba(0,0,0,.06); display:flex; align-items:center; justify-content:center; }
  .pill { display:inline-flex; align-items:center; gap:6px; padding:3px 10px; border-radius:var(--pb-radius-pill); font-size:var(--pb-text-xs); font-weight:600; }
  .pdot { width:7px; height:7px; border-radius:50%; }
  .name { font-size:var(--pb-text-xs); font-weight:var(--pb-weight-medium); margin-top:8px; }
  .hex { font-family:var(--pb-font-mono); font-size:11px; color:var(--pb-text-muted); }
</style>
</head>
<body>
  <div class="row">
    <div class="sw">
      <div class="chip" style="background:var(--pb-amber-bg);border-color:var(--pb-amber-border)">
        <span class="pill" style="background:transparent;color:var(--pb-amber)"><span class="pdot" style="background:var(--pb-amber)"></span>Working</span>
      </div>
      <div class="name">Working (amber)</div><div class="hex">#B45309 · bg #FBF1E1</div>
    </div>
    <div class="sw"><div class="chip" style="background:var(--pb-green-border)"></div><div class="name">Approve border</div><div class="hex">#B7E4C7</div></div>
    <div class="sw"><div class="chip" style="background:var(--pb-amber-border)"></div><div class="name">Amber border</div><div class="hex">#F5D9A8</div></div>
    <div class="sw"><div class="chip" style="background:var(--pb-red-border)"></div><div class="name">Reject border</div><div class="hex">#F3C2C2</div></div>
    <div class="sw"><div class="chip" style="background:var(--pb-surface);box-shadow:0 0 0 2px var(--pb-focus-ring)"></div><div class="name">Focus ring</div><div class="hex">#4F46E5</div></div>
  </div>
</body>
</html>
