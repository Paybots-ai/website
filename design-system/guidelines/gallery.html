<!-- @dsCard group="Overview" viewport="1200x900" name="Surface gallery — every screen" subtitle="Live thumbnails of every Paybots surface, click to open" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<link rel="stylesheet" href="../styles.css"/>
<style>
  body { margin:0; font-family:var(--pb-font-sans); background:var(--pb-bg); color:var(--pb-text); padding:28px; }
  h1 { font-size:24px; font-weight:700; letter-spacing:-0.01em; margin:0 0 4px; }
  .sub { font-size:14px; color:var(--pb-text-muted); margin:0 0 24px; }
  .grid { display:grid; grid-template-columns:repeat(3, 1fr); gap:20px; }
  .tile { display:flex; flex-direction:column; gap:10px; text-decoration:none; color:inherit; }
  .frame { position:relative; aspect-ratio:16/10; border:1px solid var(--pb-border); border-radius:var(--pb-radius); overflow:hidden; background:var(--pb-surface); box-shadow:var(--pb-shadow); }
  .frame iframe { position:absolute; top:0; left:0; width:1280px; height:800px; border:0; transform:scale(0.3125); transform-origin:top left; pointer-events:none; }
  .cap { display:flex; align-items:baseline; justify-content:space-between; gap:8px; }
  .name { font-size:14px; font-weight:600; }
  .tag { font-family:var(--pb-font-mono); font-size:11px; color:var(--pb-text-faint); }
  .group-label { font-size:11px; text-transform:uppercase; letter-spacing:0.06em; color:var(--pb-text-muted); font-weight:600; margin:28px 0 12px; }
  .group-label:first-of-type { margin-top:0; }
</style>
</head>
<body>
  <h1>Pay<span style="color:var(--pb-blue)">bots</span> — surface gallery</h1>
  <p class="sub">Every screen in the system, rendered live. Click any tile to open it full-size.</p>

  <div class="group-label">Marketing</div>
  <div class="grid">
    <a class="tile" href="../ui_kits/website/index.html" target="_blank"><div class="frame"><iframe src="../ui_kits/website/index.html" loading="lazy" scrolling="no" title="Marketing home"></iframe></div><div class="cap"><span class="name">Marketing site</span><span class="tag">website</span></div></a>
    <a class="tile" href="../ui_kits/website/for-merchants.html" target="_blank"><div class="frame"><iframe src="../ui_kits/website/for-merchants.html" loading="lazy" scrolling="no" title="For merchants"></iframe></div><div class="cap"><span class="name">For merchants</span><span class="tag">website</span></div></a>
    <a class="tile" href="../ui_kits/website/for-consumers.html" target="_blank"><div class="frame"><iframe src="../ui_kits/website/for-consumers.html" loading="lazy" scrolling="no" title="For consumers"></iframe></div><div class="cap"><span class="name">For consumers</span><span class="tag">website</span></div></a>
  </div>

  <div class="group-label">Operator product</div>
  <div class="grid">
    <a class="tile" href="../ui_kits/dashboard/index.html" target="_blank"><div class="frame"><iframe src="../ui_kits/dashboard/index.html" loading="lazy" scrolling="no" title="Dashboard"></iframe></div><div class="cap"><span class="name">Underwriting dashboard</span><span class="tag">dashboard</span></div></a>
    <a class="tile" href="../ui_kits/decision/index.html" target="_blank"><div class="frame"><iframe src="../ui_kits/decision/index.html" loading="lazy" scrolling="no" title="Decision result"></iframe></div><div class="cap"><span class="name">Decision result</span><span class="tag">decision</span></div></a>
    <a class="tile" href="../ui_kits/gauntlet/index.html" target="_blank"><div class="frame"><iframe src="../ui_kits/gauntlet/index.html" loading="lazy" scrolling="no" title="Gauntlet"></iframe></div><div class="cap"><span class="name">Agent Gauntlet</span><span class="tag">gauntlet</span></div></a>
  </div>

</body>
</html>
