<!-- @dsCard group="Variants" viewport="700x250" name="Status pill — treatments" subtitle="Pick the inline decision pill" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<link rel="stylesheet" href="../styles.css"/>
<style>
  body { margin:0; font-family:var(--pb-font-sans); background:var(--pb-surface); color:var(--pb-text); padding:22px 24px; }
  .row { display:flex; align-items:center; gap:16px; padding:12px 0; border-bottom:1px solid var(--pb-surface-muted); }
  .row:last-child { border-bottom:0; }
  .tag { width:150px; flex:none; font-size:var(--pb-text-xs); color:var(--pb-text-muted); }
  .pair { display:flex; gap:10px; align-items:center; }
  .dot { width:7px; height:7px; border-radius:50%; }
  .soft { display:inline-flex; align-items:center; gap:6px; padding:3px 10px; border-radius:var(--pb-radius-pill); font-size:var(--pb-text-xs); font-weight:600; border:1px solid; }
  .solid { display:inline-flex; align-items:center; gap:6px; padding:3px 11px; border-radius:var(--pb-radius-pill); font-size:var(--pb-text-xs); font-weight:600; color:#fff; }
  .outline { display:inline-flex; align-items:center; gap:6px; padding:2px 10px; border-radius:var(--pb-radius-pill); font-size:var(--pb-text-xs); font-weight:600; background:transparent; border:1.5px solid; }
  .bare { display:inline-flex; align-items:center; gap:7px; font-size:var(--pb-text-sm); font-weight:500; }
</style>
</head>
<body>
  <div class="row"><span class="tag">A · Soft + dot + thin outline (implemented)</span><div class="pair">
    <span class="soft" style="background:var(--pb-green-bg);color:var(--pb-green);border-color:var(--pb-green)"><span class="dot" style="background:var(--pb-green)"></span>Approved</span>
    <span class="soft" style="background:var(--pb-red-bg);color:var(--pb-red);border-color:var(--pb-red)"><span class="dot" style="background:var(--pb-red)"></span>Rejected</span>
  </div></div>
  <div class="row"><span class="tag">B · Solid</span><div class="pair">
    <span class="solid" style="background:var(--pb-green)">Approved</span>
    <span class="solid" style="background:var(--pb-red)">Rejected</span>
  </div></div>
  <div class="row"><span class="tag">C · Outline + dot</span><div class="pair">
    <span class="outline" style="color:var(--pb-green);border-color:var(--pb-green)"><span class="dot" style="background:var(--pb-green)"></span>Approved</span>
    <span class="outline" style="color:var(--pb-red);border-color:var(--pb-red)"><span class="dot" style="background:var(--pb-red)"></span>Rejected</span>
  </div></div>
  <div class="row"><span class="tag">D · Dot + text only</span><div class="pair">
    <span class="bare"><span class="dot" style="background:var(--pb-green)"></span>Approved</span>
    <span class="bare"><span class="dot" style="background:var(--pb-red)"></span>Rejected</span>
  </div></div>
</body>
</html>
