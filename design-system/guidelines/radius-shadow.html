<!-- @dsCard group="Spacing" viewport="700x170" name="Radius & shadow" subtitle="8 / 12 / pill — flat cards, shadows only float" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<link rel="stylesheet" href="../styles.css"/>
<style>
  body { margin:0; font-family:var(--pb-font-sans); background:var(--pb-surface-muted); color:var(--pb-text); padding:24px; }
  .row { display:flex; gap:22px; align-items:center; }
  .box { width:120px; height:80px; background:var(--pb-surface); display:flex; align-items:center; justify-content:center; font-family:var(--pb-font-mono); font-size:11px; color:var(--pb-text-muted); }
  .b1 { border:1px solid var(--pb-border); border-radius:var(--pb-radius-sm); }
  .b2 { border:1px solid var(--pb-border); border-radius:var(--pb-radius); }
  .b3 { border:1px solid var(--pb-border); border-radius:var(--pb-radius); box-shadow:var(--pb-shadow); }
  .pill { width:120px; height:36px; border-radius:var(--pb-radius-pill); border:1px solid var(--pb-border); }
</style>
</head>
<body>
  <div class="row">
    <div class="box b1">radius-sm 8</div>
    <div class="box b2">radius 12 · flat</div>
    <div class="box b3">+ shadow (float)</div>
    <div style="text-align:center"><div class="pill"></div><div style="font-family:var(--pb-font-mono);font-size:11px;color:var(--pb-text-muted);margin-top:8px">pill</div></div>
  </div>
</body>
</html>
