<!-- @dsCard group="Colors" viewport="700x150" name="Neutral ink ramp" subtitle="Text + line grays, light to dark" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<link rel="stylesheet" href="../styles.css"/>
<style>
  body { margin:0; font-family:var(--pb-font-sans); background:var(--pb-surface); color:var(--pb-text); }
  .row { display:flex; gap:14px; padding:20px 24px; }
  .sw { flex:1; }
  .chip { height:64px; border-radius:var(--pb-radius-sm); border:1px solid var(--pb-border); }
  .name { font-size:var(--pb-text-xs); font-weight:var(--pb-weight-medium); margin-top:8px; }
  .hex { font-family:var(--pb-font-mono); font-size:11px; color:var(--pb-text-muted); }
</style>
</head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--pb-ink)"></div><div class="name">Ink</div><div class="hex">#1A1A1F</div></div>
    <div class="sw"><div class="chip" style="background:var(--pb-ink-2)"></div><div class="name">Ink 2</div><div class="hex">#5C5C66</div></div>
    <div class="sw"><div class="chip" style="background:var(--pb-ink-faint)"></div><div class="name">Ink faint</div><div class="hex">#6E6E78</div></div>
    <div class="sw"><div class="chip" style="background:var(--pb-border-strong)"></div><div class="name">Border strong</div><div class="hex">#D7D2C8</div></div>
    <div class="sw"><div class="chip" style="background:var(--pb-border)"></div><div class="name">Border</div><div class="hex">#E4E0D8</div></div>
  </div>
</body>
</html>
