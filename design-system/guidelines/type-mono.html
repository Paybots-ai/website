<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<link rel="stylesheet" href="../styles.css"/>
<style>
  body { margin:0; font-family:var(--pb-font-sans); background:var(--pb-surface); color:var(--pb-text); padding:20px 24px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:12px 28px; }
  .k { font-size:var(--pb-text-eyebrow); text-transform:uppercase; letter-spacing:var(--pb-tracking-eyebrow); color:var(--pb-text-muted); margin-bottom:3px; }
  .v { font-family:var(--pb-font-mono); font-size:13px; font-variant-numeric:tabular-nums; }
  code { font-family:var(--pb-font-mono); font-size:12px; background:var(--pb-surface-muted); border:1px solid var(--pb-border); border-radius:6px; padding:2px 7px; margin-right:6px; color:var(--pb-text-muted); }
</style>
</head>
<body>
  <div class="grid">
    <div><div class="k">Amount</div><div class="v">$1,284.00</div></div>
    <div><div class="k">Purchase ID</div><div class="v">uw_8f3a2c91</div></div>
    <div><div class="k">Score</div><div class="v">0.93</div></div>
    <div><div class="k">Issued</div><div class="v">2026-06-09T14:22Z</div></div>
  </div>
  <div style="margin-top:16px"><div class="k" style="margin-bottom:6px">Reason codes</div>
    <code>item_mismatch</code><code>over_budget</code><code>price_drift</code></div>
</body>
</html>
