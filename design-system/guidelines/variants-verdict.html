<!-- @dsCard group="Variants" viewport="700x300" name="Verdict badge — tweakable" subtitle="Reshape the verdict: treatment, emphasis, signal" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<link rel="stylesheet" href="../styles.css"/>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="./tweaks-panel.jsx"></script>
<style>
  body { margin:0; font-family:var(--pb-font-sans); background:var(--pb-surface); color:var(--pb-text); padding:24px; }
  .cap { font-size:var(--pb-text-sm); color:var(--pb-text-muted); margin-bottom:18px; }
  .cap b { color:var(--pb-text); font-weight:600; }
  .stage { display:flex; gap:14px; align-items:flex-start; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useTweaks, TweaksPanel, TweakSection, TweakRadio } = window;

const DECISIONS = [
  { key: "approve", fg: "var(--pb-green)", bg: "var(--pb-green-bg)", label: "Approved", sub: "score 0.93", glyph: "✓" },
  { key: "reject", fg: "var(--pb-red)", bg: "var(--pb-red-bg)", label: "Rejected", sub: "item_mismatch", glyph: "✕" },
];

const EMPHASIS = {
  Quiet: { pad: "9px 14px", title: 14, sub: 11, dot: 8, ls: "0" },
  Default: { pad: "11px 16px", title: 16, sub: 12, dot: 9, ls: "0" },
  Loud: { pad: "13px 18px", title: 18, sub: 12.5, dot: 10, ls: "0.02em" },
};

function boxStyle(d, treatment, e) {
  const base = { display: "flex", flexDirection: "column", gap: 3, padding: e.pad, borderRadius: "var(--pb-radius-sm)" };
  if (treatment === "Solid") return { ...base, background: d.fg, color: "#fff", border: "1px solid " + d.fg };
  if (treatment === "Outline") return { ...base, background: "transparent", color: d.fg, border: "1.5px solid " + d.fg };
  return { ...base, background: d.bg, color: d.fg, border: "1px solid " + d.fg }; // Soft tint — thin colored outline
}

const DEFAULTS = /*EDITMODE-BEGIN*/{
  "treatment": "Soft tint",
  "emphasis": "Default",
  "signal": "Dot"
}/*EDITMODE-END*/;

function App() {
  const [t, setTweak] = useTweaks(DEFAULTS);
  const e = EMPHASIS[t.emphasis] || EMPHASIS.Default;
  const onSolid = t.treatment === "Solid";

  const signal = (d) => {
    if (t.signal === "None") return null;
    if (t.signal === "Glyph") return <span style={{ fontSize: e.title, lineHeight: 1 }}>{d.glyph}</span>;
    return <span style={{ width: e.dot, height: e.dot, borderRadius: "50%", background: onSolid ? "#fff" : d.fg, flex: "none" }} />;
  };

  return (
    <div>
      <div className="cap"><b>{t.treatment}</b> · {t.emphasis} · {t.signal} signal</div>
      <div className="stage">
        {DECISIONS.map((d) => (
          <div key={d.key} style={boxStyle(d, t.treatment, e)}>
            <span style={{ display: "flex", alignItems: "center", gap: 9, fontWeight: 600, fontSize: e.title, letterSpacing: e.ls }}>
              {signal(d)}{d.label}
            </span>
            <span style={{ fontFamily: "var(--pb-font-mono)", fontSize: e.sub, opacity: onSolid ? 0.9 : 0.8 }}>{d.sub}</span>
          </div>
        ))}
      </div>

      <TweaksPanel>
        <TweakSection label="Verdict badge" />
        <TweakRadio label="Treatment" value={t.treatment} options={["Solid", "Soft tint", "Outline"]} onChange={(v) => setTweak("treatment", v)} />
        <TweakRadio label="Emphasis" value={t.emphasis} options={["Quiet", "Default", "Loud"]} onChange={(v) => setTweak("emphasis", v)} />
        <TweakRadio label="Signal" value={t.signal} options={["Dot", "Glyph", "None"]} onChange={(v) => setTweak("signal", v)} />
      </TweaksPanel>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
