<!-- @dsCard group="Spacing" viewport="700x160" name="Motion" subtitle="One ease, two durations — quiet, no bounce" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<link rel="stylesheet" href="../styles.css"/>
<style>
  body { margin:0; font-family:var(--pb-font-sans); background:var(--pb-surface); color:var(--pb-text); padding:24px; }
  .row { display:flex; gap:32px; align-items:flex-start; }
  .item { flex:1; }
  .track { height:36px; background:var(--pb-surface-muted); border-radius:var(--pb-radius-sm); position:relative; overflow:hidden; cursor:pointer; }
  .dot { position:absolute; top:8px; left:8px; width:20px; height:20px; border-radius:50%; background:var(--pb-blue); }
  .name { font-family:var(--pb-font-mono); font-size:11px; color:var(--pb-text-muted); margin-top:8px; }
  .hint { font-size:11px; color:var(--pb-text-faint); margin-top:14px; }
</style>
</head>
<body>
  <div class="row">
    <div class="item"><div class="track" id="t1"><div class="dot" id="d1" style="transition:left var(--pb-dur-fast) var(--pb-ease)"></div></div><div class="name">dur-fast · 0.12s</div></div>
    <div class="item"><div class="track" id="t2"><div class="dot" id="d2" style="transition:left var(--pb-dur) var(--pb-ease)"></div></div><div class="name">dur · 0.15s</div></div>
  </div>
  <div class="hint">ease · cubic-bezier(0.2, 0, 0, 1) — short, eased, no bounce. Hover a track to play.</div>
  <script>
    function wire(t, d) {
      const tr = document.getElementById(t), dot = document.getElementById(d);
      tr.addEventListener('mouseenter', () => { dot.style.left = (tr.clientWidth - 28) + 'px'; });
      tr.addEventListener('mouseleave', () => { dot.style.left = '8px'; });
    }
    wire('t1','d1'); wire('t2','d2');
  </script>
</body>
</html>
