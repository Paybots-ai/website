<!-- @dsCard group="Components" viewport="700x720" name="Component standards" subtitle="Every primitive · sizes · states · one grid" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<link rel="stylesheet" href="../styles.css"/>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../_ds_bundle.js"></script>
<style>
  body { margin:0; font-family:var(--pb-font-sans); background:var(--pb-surface); color:var(--pb-text); padding:24px; }
  .sec { margin-bottom:22px; }
  .h { font-size:var(--pb-text-eyebrow); text-transform:uppercase; letter-spacing:var(--pb-tracking-eyebrow); color:var(--pb-text-muted); padding-bottom:7px; margin-bottom:12px; border-bottom:1px solid var(--pb-surface-muted); }
  .row { display:flex; flex-wrap:wrap; align-items:center; gap:12px; margin-bottom:10px; }
  .col { display:flex; flex-direction:column; gap:8px; max-width:320px; }
  .hint { font-size:11px; color:var(--pb-text-faint); }
</style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const ns = window.PaybotsDesignSystem_e75ed6;
    const { Button, Chip, Field, Toggle, StatusPill, VerdictBadge, DecisionDot, Toast, Tabs, PaymentCard } = ns;

    function Sec({ label, children }) {
      return <div className="sec"><div className="h">{label}</div>{children}</div>;
    }

    function Demo() {
      const [on, setOn] = React.useState(true);
      const [chip, setChip] = React.useState("all");
      const [tab, setTab] = React.useState("ledger");
      const [card, setCard] = React.useState("4921");
      return (
        <div>
          <Sec label="Button · variants">
            <div className="row">
              <Button variant="primary">Primary</Button>
              <Button variant="ghost">Ghost</Button>
              <Button variant="neutral">Neutral</Button>
              <Button variant="approve" iconLeft="✓">Approve</Button>
              <Button variant="reject" iconLeft="✕">Reject</Button>
              <Button variant="primary" disabled>Disabled</Button>
            </div>
          </Sec>
          <Sec label="Button · size scale (sm / md / lg)">
            <div className="row">
              <Button size="sm" variant="ghost">Small</Button>
              <Button size="md" variant="ghost">Medium</Button>
              <Button size="lg" variant="ghost">Large</Button>
              <span className="hint">Tab to any control to see the 2px focus ring.</span>
            </div>
          </Sec>
          <Sec label="Chip · size + active">
            <div className="row">
              {["all","approve","reject"].map(k => (
                <Chip key={k} active={chip===k} onClick={()=>setChip(k)}>{k==="all"?"All":k==="approve"?"Approved":"Rejected"}</Chip>
              ))}
              <Chip size="sm">sm</Chip><Chip size="md">md</Chip>
            </div>
          </Sec>
          <Sec label="Status pill · size sm / md">
            <div className="row">
              <StatusPill status="approve" /><StatusPill status="reject" /><StatusPill status="working" />
              <StatusPill status="approve" size="sm" /><StatusPill status="reject" size="sm" />
              <StatusPill status="neutral">Read-only</StatusPill>
            </div>
          </Sec>
          <Sec label="Verdict badge · treatments">
            <div className="row">
              <VerdictBadge decision="approve" subtitle="93%" />
              <VerdictBadge decision="reject" subtitle="item_mismatch" />
              <VerdictBadge decision="approve" subtitle="solid" variant="solid" />
              <VerdictBadge decision="reject" subtitle="outline" variant="outline" />
            </div>
          </Sec>
          <Sec label="Decision dot">
            <div className="row" style={{gap:18}}>
              <span style={{display:"flex",alignItems:"center",gap:7,fontSize:13,color:"var(--pb-text-muted)"}}><DecisionDot decision="approve" />Approved</span>
              <span style={{display:"flex",alignItems:"center",gap:7,fontSize:13,color:"var(--pb-text-muted)"}}><DecisionDot decision="reject" />Rejected</span>
              <span style={{display:"flex",alignItems:"center",gap:7,fontSize:13,color:"var(--pb-text-muted)"}}><DecisionDot decision="working" pulse />Working…</span>
            </div>
          </Sec>
          <Sec label="Field · size + Toggle · size">
            <div className="row" style={{alignItems:"flex-start"}}>
              <div style={{width:170}}><Field size="sm" label="Small" defaultValue="sm" /></div>
              <div style={{width:170}}><Field size="md" label="Per-purchase cap" prefix="$" defaultValue="500" /></div>
              <div style={{display:"flex",flexDirection:"column",gap:10}}>
                <Toggle size="sm" checked={on} onChange={setOn} label="sm" />
                <Toggle size="md" checked={on} onChange={setOn} label="md" />
              </div>
            </div>
          </Sec>
          <Sec label="Tabs">
            <Tabs value={tab} onChange={setTab} tabs={[{id:"ledger",label:"Ledger"},{id:"analytics",label:"Analytics"},{id:"disputes",label:"Disputes",badge:2}]} />
          </Sec>
          <Sec label="Payment card · states">
            <div className="col">
              <PaymentCard brand="visa" label="Travel card" last4="4921" exp="08/27" selected={card==="4921"} onSelect={()=>setCard("4921")} />
              <PaymentCard brand="mastercard" label="Default" last4="2045" exp="03/28" selected={card==="2045"} onSelect={()=>setCard("2045")} />
              <PaymentCard brand="amex" label="Procurement" last4="8810" status="frozen" />
            </div>
          </Sec>
          <Sec label="Toast · float elevation">
            <div className="row">
              <Toast tone="success" title="Payment captured" message="uw_8f3a2c91 sealed." />
              <Toast tone="error" title="Backend offline" />
            </div>
          </Sec>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById("root")).render(<Demo/>);
  </script>
</body>
</html>
