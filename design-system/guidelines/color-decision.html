<!-- @dsCard group="Colors" viewport="700x180" name="Decision scale" subtitle="approve / reject — the semantic spine" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<link rel="stylesheet" href="../styles.css"/>
<style>
  body { margin:0; font-family:var(--pb-font-sans); background:var(--pb-surface); color:var(--pb-text); }
  .row { display:flex; gap:16px; padding:20px 24px; }
  .col { flex:1; border:1px solid var(--pb-border); border-radius:var(--pb-radius); overflow:hidden; }
  .bar { height:44px; display:flex; align-items:center; gap:10px; padding:0 14px; color:#fff; font-weight:var(--pb-weight-medium); font-size:var(--pb-text-sm); }
  .dot { width:10px; height:10px; border-radius:50%; background:#fff; }
  .body { padding:10px 14px 14px; }
  .pill { display:inline-flex; align-items:center; gap:6px; padding:3px 10px; border-radius:var(--pb-radius-pill); font-size:var(--pb-text-xs); font-weight:600; white-space:nowrap; }
  .pdot { width:7px; height:7px; border-radius:50%; }
  .hex { font-family:var(--pb-font-mono); font-size:11px; color:var(--pb-text-muted); margin-top:10px; }
</style>
</head>
<body>
  <div class="row">
    <div class="col">
      <div class="bar" style="background:var(--pb-green)"><span class="dot"></span>APPROVE — seal issued</div>
      <div class="body">
        <span class="pill" style="background:var(--pb-green-bg);color:var(--pb-green)"><span class="pdot" style="background:var(--pb-green)"></span>Approved</span>
        <div class="hex">#15803D · bg #E7F5EC</div>
      </div>
    </div>
    <div class="col">
      <div class="bar" style="background:var(--pb-red)"><span class="dot"></span>REJECT — blocked, no seal</div>
      <div class="body">
        <span class="pill" style="background:var(--pb-red-bg);color:var(--pb-red)"><span class="pdot" style="background:var(--pb-red)"></span>Rejected</span>
        <div class="hex">#B91C1C · bg #FBEAEA</div>
      </div>
    </div>
  </div>
</body>
</html>
