<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<link rel="stylesheet" href="../styles.css"/>
<style>
  body { margin:0; font-family:var(--pb-font-sans); background:var(--pb-surface); color:var(--pb-text); padding:24px; display:flex; align-items:center; gap:48px; }
  .on-deep { background:var(--pb-brand-deep); padding:20px 24px; border-radius:var(--pb-radius); display:flex; align-items:center; }
  .cap { font-size:var(--pb-text-eyebrow); text-transform:uppercase; letter-spacing:var(--pb-tracking-eyebrow); color:var(--pb-text-muted); margin-top:10px; }
</style>
</head>
<body>
  <div>
    <img src="../assets/paybots-logo.svg" height="34" alt="Paybots"/>
    <div class="cap">Primary wordmark — the y is a check</div>
  </div>
  <div>
    <img src="../assets/paybots-mark.svg" width="56" height="56" alt=""/>
    <div class="cap">App icon</div>
  </div>
  <div>
    <div class="on-deep"><img src="../assets/paybots-mark.svg" width="48" height="48" alt=""/></div>
    <div class="cap">On brand indigo</div>
  </div>
</body>
</html>
