<!-- @dsCard group="Colors" viewport="700x150" name="Brand indigo" subtitle="Primary action indigo + deep brand indigo + soft tint" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<link rel="stylesheet" href="../styles.css"/>
<style>
  body { margin:0; font-family:var(--pb-font-sans); background:var(--pb-surface); color:var(--pb-text); }
  .row { display:flex; gap:0; padding:20px 24px; }
  .sw { flex:1; }
  .chip { height:64px; border-radius:var(--pb-radius-sm); border:1px solid rgba(0,0,0,.06); }
  .name { font-size:var(--pb-text-xs); font-weight:var(--pb-weight-medium); margin-top:8px; }
  .hex { font-family:var(--pb-font-mono); font-size:11px; color:var(--pb-text-muted); }
  .row { gap:14px; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--pb-brand-deep)"></div><div class="name">Brand deep</div><div class="hex">#4338CA</div></div>
    <div class="sw"><div class="chip" style="background:var(--pb-blue)"></div><div class="name">Primary</div><div class="hex">#4F46E5</div></div>
    <div class="sw"><div class="chip" style="background:var(--pb-blue-hover)"></div><div class="name">Hover</div><div class="hex">#4338CA</div></div>
    <div class="sw"><div class="chip" style="background:var(--pb-blue-pressed)"></div><div class="name">Pressed</div><div class="hex">#3A2FB0</div></div>
    <div class="sw"><div class="chip" style="background:var(--pb-blue-soft)"></div><div class="name">Soft tint</div><div class="hex">#EEEBFF</div></div>
  </div>
</body>
</html>
