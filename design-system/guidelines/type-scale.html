<!-- @dsCard group="Type" viewport="700x300" name="Type scale" subtitle="DM Sans — display to eyebrow" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<link rel="stylesheet" href="../styles.css"/>
<style>
  body { margin:0; font-family:var(--pb-font-sans); background:var(--pb-surface); color:var(--pb-text); padding:20px 24px; }
  .r { display:flex; align-items:baseline; gap:16px; padding:7px 0; border-bottom:1px solid var(--pb-surface-muted); }
  .lab { width:120px; flex:none; font-family:var(--pb-font-mono); font-size:11px; color:var(--pb-text-muted); }
  .specimen { font-weight:var(--pb-weight-medium); letter-spacing:-0.01em; }
</style>
</head>
<body>
  <div class="r"><span class="lab">display · 34</span><span class="specimen" style="font-size:var(--pb-text-display)">$1,284.00</span></div>
  <div class="r"><span class="lab">h1 · 24</span><span class="specimen" style="font-size:var(--pb-text-h1)">Underwriting ledger</span></div>
  <div class="r"><span class="lab">h2 · 19</span><span class="specimen" style="font-size:var(--pb-text-h2)">Automated decision logic</span></div>
  <div class="r"><span class="lab">h3 · 16</span><span class="specimen" style="font-size:var(--pb-text-h3)">Why Paybots rejected this</span></div>
  <div class="r"><span class="lab">body · 14</span><span class="specimen" style="font-weight:400;font-size:var(--pb-text-body)">Every decision Paybots stood behind, read-only.</span></div>
  <div class="r"><span class="lab">sm · 13</span><span class="specimen" style="font-weight:400;font-size:var(--pb-text-sm);color:var(--pb-text-muted)">Switching business takes you to that ledger.</span></div>
  <div class="r"><span class="lab">eyebrow · 11</span><span class="specimen" style="font-size:var(--pb-text-eyebrow);text-transform:uppercase;letter-spacing:var(--pb-tracking-eyebrow);color:var(--pb-text-muted)">Decision</span></div>
</body>
</html>
