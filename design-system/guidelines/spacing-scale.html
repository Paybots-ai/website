<!-- @dsCard group="Spacing" viewport="700x150" name="Spacing scale" subtitle="4px base — 4 / 8 / 12 / 16 / 24 / 32 / 48" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<link rel="stylesheet" href="../styles.css"/>
<style>
  body { margin:0; font-family:var(--pb-font-sans); background:var(--pb-surface); color:var(--pb-text); padding:24px; }
  .row { display:flex; align-items:flex-end; gap:18px; }
  .u { text-align:center; }
  .bar { background:var(--pb-blue-soft); border:1px solid var(--pb-blue); border-radius:4px; }
  .lab { font-family:var(--pb-font-mono); font-size:11px; color:var(--pb-text-muted); margin-top:8px; }
</style>
</head>
<body>
  <div class="row">
    <div class="u"><div class="bar" style="width:4px;height:4px"></div><div class="lab">4</div></div>
    <div class="u"><div class="bar" style="width:8px;height:8px"></div><div class="lab">8</div></div>
    <div class="u"><div class="bar" style="width:12px;height:12px"></div><div class="lab">12</div></div>
    <div class="u"><div class="bar" style="width:16px;height:16px"></div><div class="lab">16</div></div>
    <div class="u"><div class="bar" style="width:24px;height:24px"></div><div class="lab">24</div></div>
    <div class="u"><div class="bar" style="width:32px;height:32px"></div><div class="lab">32</div></div>
    <div class="u"><div class="bar" style="width:48px;height:48px"></div><div class="lab">48</div></div>
  </div>
</body>
</html>
